# Alembic scaffold placeholder for production migration
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg2://user:pass@localhost:5432/secretsanta

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
