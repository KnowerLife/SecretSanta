version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: secretsanta
      POSTGRES_USER: secretsanta
      POSTGRES_PASSWORD: secretsanta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: prod_stack/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://secretsanta:secretsanta@postgres:5432/secretsanta
      REDIS_URL: redis://redis:6379/0
      SECRET_SANTA_SECRET: change-me
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: prod_stack/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://secretsanta:secretsanta@postgres:5432/secretsanta
      REDIS_URL: redis://redis:6379/0
      SECRET_SANTA_SECRET: change-me
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
