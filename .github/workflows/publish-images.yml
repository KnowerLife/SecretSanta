name: Publish images

# Публикация образов v69 в GHCR по git-тегу v* или вручную.
# GITHUB_TOKEN используется только для логина и не попадает в build-args и логи.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образа, например v69.1.2'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secret-santa-api:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/secret-santa-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            SECRET_SANTA_API_TARGET=http://api:8787
          tags: |
            ghcr.io/${{ github.repository_owner }}/secret-santa-web:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/secret-santa-web:latest
